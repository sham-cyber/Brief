openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: briefings
    description: Source-grounded pre-meeting briefings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /briefings:
    post:
      operationId: createBriefing
      tags: [briefings]
      summary: Create a sourced pre-meeting briefing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefingInput"
      responses:
        "200":
          description: A briefing with source-linked claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingResult"
        "400":
          description: Invalid briefing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Research or briefing generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BriefingInput:
      type: object
      properties:
        subject:
          type: string
          minLength: 2
          maxLength: 200
        subjectType:
          type: string
          enum: [company, person]
        meetingAt:
          type: string
          format: date-time
        context:
          type: string
          maxLength: 1500
        topics:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [news, hire, launch, financial, risk]
      required: [subject, subjectType, meetingAt, topics]
    BriefSource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        publisher:
          type: string
        publishedAt:
          type: ["string", "null"]
        snippet:
          type: string
      required: [id, title, url, publisher, publishedAt, snippet]
    BriefingHighlight:
      type: object
      properties:
        category:
          type: string
          enum: [news, hire, launch, financial, risk]
        title:
          type: string
        summary:
          type: string
        sourceIds:
          type: array
          items:
            type: string
          minItems: 1
      required: [category, title, summary, sourceIds]
    BriefingOverview:
      type: object
      properties:
        text:
          type: string
        sourceIds:
          type: array
          items:
            type: string
          minItems: 1
      required: [text, sourceIds]
    BriefingQuestion:
      type: object
      properties:
        text:
          type: string
        sourceIds:
          type: array
          items:
            type: string
      required: [text, sourceIds]
    BriefingResult:
      type: object
      properties:
        subject:
          type: string
        subjectType:
          type: string
          enum: [company, person]
        topics:
          type: array
          items:
            type: string
            enum: [news, hire, launch, financial, risk]
        meetingAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        overview:
          $ref: "#/components/schemas/BriefingOverview"
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/BriefingHighlight"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/BriefingQuestion"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/BriefSource"
      required:
        - subject
        - subjectType
        - topics
        - meetingAt
        - generatedAt
        - windowStart
        - windowEnd
        - overview
        - highlights
        - questions
        - sources

