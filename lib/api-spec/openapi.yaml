    BriefingResult:
      type: object
      properties:
        briefingId:
          type: string
          format: uuid
        subject:
          type: string
        subjectType:
          type: string
          enum: [company, person]
        personRole:
          type: ["string", "null"]
          enum: [business_owner, mp, corporate, null]
        publicRoleTitle:
          type: ["string", "null"]
          maxLength: 80
        companyName:
          type: ["string", "null"]
          maxLength: 200
        sourceMode:
          type: string
          enum: [public, private, sap]
        sapAreas:
          type: array
          items:
            $ref: "#/components/schemas/SapDataArea"
        topics:
          type: array
          items:
            type: string
            enum: [news, hire, launch, financial, risk]
        meetingAt:
          type: ["string", "null"]
          format: date-time
        generatedAt:
          type: string
          format: date-time
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        searchCreditsUsed:
          type: ["integer", "null"]
          minimum: 0
        sourceSearchesCompleted:
          type: integer
          minimum: 0
