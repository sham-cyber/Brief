        - publicRoleTitle
        - companyName
        - sourceMode
        - sapAreas
        - topics
        - meetingAt
        - generatedAt
        - windowStart
        - windowEnd
        - searchCreditsUsed
        - sourceSearchesCompleted
        - searchResultsReturned
        - overview
        - highlights
        - questions
        - topicBriefs
        - aiSummaries
        - aiSummaryNotice
        - sources
        - sapData
