openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: briefings
    description: Source-grounded pre-meeting briefings
  - name: person-profiles
    description: Optional account-scoped person details
paths:
  /tavily-credentials:
    get:
      operationId: getTavilyCredential
      tags: [briefings]
      summary: Get the signed-in user's Tavily connection status
      responses:
        "200":
          description: Connection status without returning the credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TavilyCredentialStatus"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: saveTavilyCredential
      tags: [briefings]
      summary: Save the signed-in user's Tavily API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TavilyCredentialInput"
      responses:
        "200":
          description: Saved status without returning the credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TavilyCredentialStatus"
        "400":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request did not come from this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Encrypted credential storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTavilyCredential
      tags: [briefings]
      summary: Remove the signed-in user's Tavily API key
      responses:
        "200":
          description: Disconnected status without returning the credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TavilyCredentialStatus"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request did not come from this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /briefings:
    get:
      operationId: getBriefingSourceStatus
      tags: [briefings]
      summary: Get source readiness and the public-search crawl allowance
      responses:
        "200":
          description: Public Tavily status, SAP configuration readiness, and crawl allowance without exposing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingSourceStatus"
    post:
      operationId: createBriefing
      tags: [briefings]
      summary: Create a public or SAP-sourced pre-meeting briefing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefingInput"
      responses:
        "200":
          description: A briefing with source-linked claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingResult"
        "400":
          description: Invalid briefing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required to run a source search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The start PIN is incorrect or the signed-in account is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The start PIN attempt limit or shared crawl allowance is exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Research or briefing generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The crawl reached its three-minute hard stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Tavily, SAP, or start-PIN configuration is unavailable, or a private source is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /person-profiles:
    get:
      operationId: listPersonProfiles
      tags: [person-profiles]
      summary: List saved person profiles for the signed-in user
      responses:
        "200":
          description: Saved person profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfileList"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: savePersonProfile
      tags: [person-profiles]
      summary: Save person details to the signed-in user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonProfileInput"
      responses:
        "200":
          description: Saved person profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfile"
        "400":
          description: Invalid person profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /person-profiles/{profileId}:
    delete:
      operationId: deletePersonProfile
      tags: [person-profiles]
      summary: Remove a saved person profile from the signed-in user's account
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved profile removal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfileDeleteResult"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Saved profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BriefingInput:
      type: object
      properties:
        startPin:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[0-9]{4}$"
        subject:
          type: string
          minLength: 2
          maxLength: 200
        subjectType:
          type: string
          enum: [company, person]
        personRole:
          type: ["string", "null"]
          enum: [business_owner, mp, corporate, null]
        publicRoleTitle:
          type: string
          maxLength: 80
        companyName:
          type: string
          maxLength: 200
        sourceMode:
          type: string
          enum: [public, private, sap]
          default: public
        sapAreas:
          type: array
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SapDataArea"
          description: SAP S/4HANA data areas selected for this briefing. Required only when sourceMode is sap.
        meetingAt:
          type: string
          format: date-time
        context:
          type: string
          maxLength: 1500
        topics:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [news, hire, launch, financial, risk]
      required: [startPin, subject, subjectType, personRole, sourceMode, meetingAt, topics]
    SapDataArea:
      type: string
      enum: [store, production, maintenance, inventory, sales, hr, power_electrical_solar]
    BriefSource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        publisher:
          type: string
        publishedAt:
          type: ["string", "null"]
        snippet:
          type: string
        affiliatedCompanyReport:
          type: boolean
          description: True when this source is about the selected person's associated company rather than the person.
        images:
          type: array
          description: Images extracted from this accepted source. Images remain optional when none are available.
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              description:
                type: string
            required: [url, description]
      required: [id, title, url, publisher, publishedAt, snippet, affiliatedCompanyReport]
    BriefingSourceStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [tavily]
        configured:
          type: boolean
          description: Whether this signed-in account has an effective Tavily key.
        canStart:
          type: boolean
          description: Whether this signed-in account is the configured owner allowed to start crawls.
        keySource:
          type: string
          enum: [project-owner, account, missing]
          description: Effective key source for this account; the project key is owner-only.
        startPinConfigured:
          type: boolean
        ownerAccountConfigured:
          type: boolean
        dailyCrawlLimitMs:
          type: integer
          minimum: 0
        dailyCrawlUsedMs:
          type: ["integer", "null"]
          minimum: 0
        dailyCrawlRemainingMs:
          type: ["integer", "null"]
          minimum: 0
        dailyCrawlActive:
          type: boolean
        dailyCrawlResetsAt:
          type: ["string", "null"]
          format: date-time
        dailyCrawlStartsLimit:
          type: ["integer", "null"]
          minimum: 0
          maximum: 10
        dailyCrawlStartsUsed:
          type: ["integer", "null"]
          minimum: 0
        dailyCrawlStartsRemaining:
          type: ["integer", "null"]
          minimum: 0
        dailySearchRequestsLimit:
          type: ["integer", "null"]
          minimum: 0
          maximum: 50
          description: Informational maximum of five topic searches across each of ten daily briefing events; not a separate daily start limit.
        dailySearchRequestsUsed:
          type: ["integer", "null"]
          minimum: 0
        dailySearchRequestsRemaining:
          type: ["integer", "null"]
          minimum: 0
        maxSearchesPerBriefing:
          type: integer
          minimum: 1
          maximum: 5
          description: One request per selected topic, up to five topics.
        searchDepth:
          type: string
          enum: [basic]
        sapConfigured:
          type: boolean
          description: Whether the server has an SAP S/4HANA OAuth connection and at least one approved area mapping configured. This does not probe SAP.
        sapAvailableAreas:
          type: array
          items:
            $ref: "#/components/schemas/SapDataArea"
      required:
        - provider
        - configured
        - canStart
        - keySource
        - startPinConfigured
        - ownerAccountConfigured
        - dailyCrawlLimitMs
        - dailyCrawlUsedMs
        - dailyCrawlRemainingMs
        - dailyCrawlActive
        - dailyCrawlResetsAt
        - dailyCrawlStartsLimit
        - dailyCrawlStartsUsed
        - dailyCrawlStartsRemaining
        - dailySearchRequestsLimit
        - dailySearchRequestsUsed
        - dailySearchRequestsRemaining
        - maxSearchesPerBriefing
        - searchDepth
        - sapConfigured
        - sapAvailableAreas
    TavilyCredentialStatus:
      type: object
      properties:
        connected:
          type: boolean
        storageReady:
          type: boolean
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required: [connected, storageReady, updatedAt]
    TavilyCredentialInput:
      type: object
      properties:
        apiKey:
          type: string
          minLength: 20
          maxLength: 4096
      required: [apiKey]
    BriefingHighlight:
      type: object
      properties:
        category:
          type: string
          enum: [news, hire, launch, financial, risk]
        title:
          type: string
        summary:
          type: string
        sourceIds:
          type: array
          items:
            type: string
          minItems: 1
      required: [category, title, summary, sourceIds]
    BriefingOverview:
      type: object
      properties:
        text:
          type: string
        sourceIds:
          type: array
          items:
            type: string
        topPositive:
          $ref: "#/components/schemas/BriefingSignal"
        topNegative:
          $ref: "#/components/schemas/BriefingSignal"
      required: [text, sourceIds, topPositive, topNegative]
    BriefingSignal:
      type: object
      properties:
        text:
          type: string
        sourceIds:
          type: array
          items:
            type: string
      required: [text, sourceIds]
    BriefingTopicBrief:
      type: object
      properties:
        category:
          type: string
          enum: [news, hire, launch, financial, risk]
        text:
          type: string
        sourceIds:
          type: array
          items:
            type: string
        topPositive:
          $ref: "#/components/schemas/BriefingSignal"
        topNegative:
          $ref: "#/components/schemas/BriefingSignal"
      required: [category, text, sourceIds, topPositive, topNegative]
    BriefingQuestion:
      type: object
      properties:
        text:
          type: string
        sourceIds:
          type: array
          items:
            type: string
      required: [text, sourceIds]
    BriefingResult:
      type: object
      properties:
        briefingId:
          type: string
          format: uuid
        subject:
          type: string
        subjectType:
          type: string
          enum: [company, person]
        personRole:
          type: ["string", "null"]
          enum: [business_owner, mp, corporate, null]
        publicRoleTitle:
          type: ["string", "null"]
          maxLength: 80
        companyName:
          type: ["string", "null"]
          maxLength: 200
        sourceMode:
          type: string
          enum: [public, private, sap]
        sapAreas:
          type: array
          items:
            $ref: "#/components/schemas/SapDataArea"
        topics:
          type: array
          items:
            type: string
            enum: [news, hire, launch, financial, risk]
        meetingAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        searchCreditsUsed:
          type: ["integer", "null"]
          minimum: 0
        sourceSearchesCompleted:
          type: integer
          minimum: 0
          description: Completed Tavily topic searches or SAP area requests, depending on sourceMode.
        searchResultsReturned:
          type: integer
          minimum: 0
        overview:
          $ref: "#/components/schemas/BriefingOverview"
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/BriefingHighlight"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/BriefingQuestion"
        topicBriefs:
          type: array
          items:
            $ref: "#/components/schemas/BriefingTopicBrief"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/BriefSource"
        sapData:
          type: array
          description: Cited records from the selected SAP S/4HANA areas. Empty for non-SAP briefs.
          items:
            $ref: "#/components/schemas/SapBriefingDataItem"
      required:
        - briefingId
        - subject
        - subjectType
        - personRole
        - publicRoleTitle
        - companyName
        - sourceMode
        - sapAreas
        - topics
        - meetingAt
        - generatedAt
        - windowStart
        - windowEnd
        - searchCreditsUsed
        - sourceSearchesCompleted
        - searchResultsReturned
        - overview
        - highlights
        - questions
        - topicBriefs
        - sources
        - sapData
    SapBriefingDataItem:
      type: object
      properties:
        area:
          $ref: "#/components/schemas/SapDataArea"
        recordId:
          type: string
        title:
          type: string
        detail:
          type: string
        recordedAt:
          type: string
          format: date-time
        sourceIds:
          type: array
          minItems: 1
          items:
            type: string
      required: [area, recordId, title, detail, recordedAt, sourceIds]
    PersonProfileInput:
      type: object
      properties:
        personName:
          type: string
          minLength: 2
          maxLength: 200
        personRole:
          type: string
          enum: [business_owner, mp, corporate]
        publicRoleTitle:
          type: ["string", "null"]
          maxLength: 80
        companyName:
          type: ["string", "null"]
          maxLength: 200
      required: [personName, personRole]
    PersonProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        personName:
          type: string
        personRole:
          type: string
          enum: [business_owner, mp, corporate]
        publicRoleTitle:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required: [id, personName, personRole, publicRoleTitle, companyName, updatedAt]
    PersonProfileList:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/PersonProfile"
      required: [profiles]
    PersonProfileDeleteResult:
      type: object
      properties:
        deleted:
          type: boolean
      required: [deleted]

