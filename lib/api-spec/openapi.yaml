          type: boolean
        chatId:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
          format: date-time
        limit:
          type: integer
          minimum: 0
        usedThisHour:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        windowResetsAt:
          type: ["string", "null"]
          format: date-time
      required: [connected, storageReady, chatId, updatedAt, limit, usedThisHour, remaining, windowResetsAt]
    TelegramCredentialInput:
      type: object
      properties:
