openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: briefings
    description: Source-grounded pre-meeting briefings
  - name: person-profiles
    description: Optional account-scoped person details
  - name: sap-connection
    description: Owner-managed SAP S/4HANA OData connection
  - name: telegram
    description: Owner-only encrypted Telegram PDF delivery
  - name: ai
    description: Optional source-grounded AI summaries with per-account controls
paths:
  /tavily-credentials:
    get:
      operationId: getTavilyCredential
      tags: [briefings]
      summary: Get the signed-in user's Tavily connection status
      responses:
        "200":
          description: Connection status without returning the credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TavilyCredentialStatus"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: saveTavilyCredential
      tags: [briefings]
      summary: Save the signed-in user's Tavily API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TavilyCredentialInput"
      responses:
        "200":
          description: Saved status without returning the credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TavilyCredentialStatus"
        "400":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request did not come from this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Encrypted credential storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTavilyCredential
      tags: [briefings]
      summary: Remove the signed-in user's Tavily API key
      responses:
        "200":
          description: Disconnected status without returning the credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TavilyCredentialStatus"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request did not come from this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai/guardrails:
    get:
      operationId: getAiGuardrails
      tags: [ai]
      summary: Get AI activation and cost-guardrail status for the signed-in user
      responses:
        "200":
          description: AI state without exposing secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiGuardrailStatus"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai/guardrails/passcode:
    put:
      operationId: saveAiGuardrailPasscode
      tags: [ai]
      summary: Set or replace the signed-in user's AI activation passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPasscodeInput"
      responses:
        "200":
          description: Passcode set and AI left deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPasscodeStatus"
  /ai/guardrails/activate:
    post:
      operationId: activateAiGuardrails
      tags: [ai]
      summary: Activate optional AI for the signed-in user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPasscodeInput"
      responses:
        "200":
          description: AI guardrail activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiActivationStatus"
        "403":
          description: Passcode is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: AI is disabled by the server or has no provider connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai/guardrails/deactivate:
    post:
      operationId: deactivateAiGuardrails
      tags: [ai]
      summary: Stop optional AI for the signed-in user's account
      responses:
        "200":
          description: AI deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiActivationStatus"
  /telegram-credentials:
    get:
      operationId: getTelegramCredential
      tags: [telegram]
      summary: Get Telegram connection and delivery-limit status
      responses:
        "200":
          description: Connection status without returning the bot token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramCredentialStatus"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the configured owner can use Telegram delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: saveTelegramCredential
      tags: [telegram]
      summary: Save the owner's Telegram bot token and chat ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramCredentialInput"
      responses:
        "200":
          description: Saved connection status without returning the token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramCredentialStatus"
        "400":
          description: Bot token or chat ID is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request did not come from this app or owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Encrypted credential storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTelegramCredential
      tags: [telegram]
      summary: Remove the owner's Telegram connection
      responses:
        "200":
          description: Disconnected status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramCredentialStatus"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request did not come from this app or owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /telegram-credentials/test:
    post:
      operationId: testTelegramCredential
      tags: [telegram]
      summary: Test the saved Telegram bot and destination without sending a message
      responses:
        "200":
          description: Bot and chat validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramCredentialTestResult"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the configured owner can test Telegram delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /telegram-send:
    post:
      operationId: sendTelegramBriefingPdf
      tags: [telegram]
      summary: Send a one-page briefing PDF to the owner's saved Telegram chat
      parameters:
        - name: X-Briefing-Start-Pin
          in: header
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 4
            pattern: "^[0-9]{4}$"
        - name: X-Briefing-Filename
          in: header
          required: false
          schema:
            type: string
            maxLength: 96
            pattern: "^[A-Za-z0-9_-]+\\.pdf$"
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: PDF sent to the saved Telegram chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSendResponse"
        "400":
          description: Request or PDF is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the configured owner can send Telegram PDFs or the PIN is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Three PDFs have already been sent in the rolling hour, or the PIN is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Telegram did not accept the PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Telegram credentials or delivery storage are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sap-connection:
    get:
      operationId: getSapConnectionSettings
      tags: [sap-connection]
      summary: Get safe SAP connection settings for the configured app owner
      responses:
        "200":
          description: Connection details without OAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SapConnectionSettings"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the configured app owner can manage this connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: saveSapConnectionSettings
      tags: [sap-connection]
      summary: Save an owner-managed SAP S/4HANA OData connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SapConnectionInput"
      responses:
        "200":
          description: Saved status without returning OAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SapConnectionSettings"
        "400":
          description: Invalid SAP connection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the configured app owner can manage this connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Encrypted credential storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSapConnectionSettings
      tags: [sap-connection]
      summary: Delete the configured owner's saved SAP connection
      responses:
        "200":
          description: Saved SAP connection deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SapConnectionDeleteResult"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the configured app owner can manage this connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sap-connection/test:
    post:
      operationId: testSapConnection
      tags: [sap-connection]
      summary: Test saved SAP OAuth and OData metadata without reading business records
      responses:
        "200":
          description: SAP connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SapConnectionTestResult"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the configured app owner can test this connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Wait before testing the SAP connection again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: SAP connection is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /briefings:
    get:
      operationId: getBriefingSourceStatus
      tags: [briefings]
      summary: Get source readiness and the public-search crawl allowance
      responses:
        "200":
          description: Public Tavily status, SAP configuration readiness, and crawl allowance without exposing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingSourceStatus"
    post:
      operationId: createBriefing
      tags: [briefings]
      summary: Create a public or SAP-sourced pre-meeting briefing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefingInput"
      responses:
        "200":
          description: A briefing with source-linked claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingResult"
        "400":
          description: Invalid briefing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required to run a source search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The start PIN is incorrect or the signed-in account is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The start PIN attempt limit or shared crawl allowance is exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Research or briefing generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Tavily, SAP, or start-PIN configuration is unavailable, or a private source is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The crawl reached its three-minute hard stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /customer-search:
    post:
      operationId: createCustomerSearch
      tags: [briefings]
      summary: Find cited public business prospects for a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSearchInput"
      responses:
        "200":
          description: Public business search results with source-grounded contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSearchResponse"
        "400":
          description: Invalid customer search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The start PIN is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The start PIN attempt limit or search allowance is exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Tavily search failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The search reached its hard stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The Tavily key or secure credential storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /briefings/daily-event-limit:
    put:
      operationId: setDailyBriefingEventLimit
      tags: [briefings]
      summary: Set the signed-in user's daily briefing event limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyBriefingEventLimitInput"
      responses:
        "200":
          description: The saved daily event limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBriefingEventLimitResponse"
        "400":
          description: The limit is outside the allowed range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request did not come from this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /person-profiles:
    get:
      operationId: listPersonProfiles
      tags: [person-profiles]
      summary: List saved person profiles for the signed-in user
      responses:
        "200":
          description: Saved person profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfileList"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: savePersonProfile
      tags: [person-profiles]
      summary: Save person details to the signed-in user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonProfileInput"
      responses:
        "200":
          description: Saved person profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfile"
        "400":
          description: Invalid person profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /person-profiles/{profileId}:
    delete:
      operationId: deletePersonProfile
      tags: [person-profiles]
      summary: Remove a saved person profile from the signed-in user's account
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved profile removal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfileDeleteResult"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Saved profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BriefingInput:
      type: object
      properties:
        startPin:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[0-9]{4}$"
        subject:
          type: string
          minLength: 2
          maxLength: 200
        subjectType:
          type: string
          enum: [company, person]
        personRole:
          type: ["string", "null"]
          enum: [business_owner, mp, corporate, null]
        publicRoleTitle:
          type: string
          maxLength: 80
        companyName:
          type: string
          maxLength: 200
        sourceMode:
          type: string
          enum: [public, private, sap]
          default: public
        sapAreas:
          type: array
          maxItems: 11
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SapDataArea"
          description: SAP S/4HANA data areas selected for this briefing. Required only when sourceMode is sap.
        meetingAt:
          type: string
          format: date-time
        context:
          type: string
          maxLength: 1500
        question:
          type: string
          maxLength: 500
          description: Optional direct question to guide the selected public searches and cited overview.
        useAi:
          type: boolean
          default: false
          description: Explicitly opt this briefing into source-grounded AI summaries. Defaults to off.
        topics:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [news, hire, launch, financial, risk]
      required: [startPin, subject, subjectType, personRole, sourceMode, topics]
    CustomerSearchInput:
      type: object
      properties:
        startPin:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[0-9]{4}$"
        personName:
          type: string
          minLength: 2
          maxLength: 200
        personRole:
          type: string
          enum: [business_owner, mp, corporate]
        companyName:
          type: string
          maxLength: 200
        publicRoleTitle:
          type: string
          maxLength: 80
        productOrCategory:
          type: string
          minLength: 2
          maxLength: 120
        city:
          type: string
          minLength: 2
          maxLength: 100
        state:
          type: string
          minLength: 2
          maxLength: 100
      required: [startPin, personName, personRole, productOrCategory, city, state]
    CustomerSearchSource:
      type: object
      properties:
        id:
          type: string
        businessName:
          type: string
        sourceUrl:
          type: string
          format: uri
        publisher:
          type: string
        excerpt:
          type: string
          maxLength: 700
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, businessName, sourceUrl, publisher, excerpt, phone, email, publishedAt]
    CustomerSearchResponse:
      type: object
      properties:
        personName:
          type: string
        personRole:
          type: string
          enum: [business_owner, mp, corporate]
        companyName:
          type: ["string", "null"]
        productOrCategory:
          type: string
        city:
          type: string
        state:
          type: string
        generatedAt:
          type: string
          format: date-time
        searchCreditsUsed:
          type: ["integer", "null"]
          minimum: 0
        searchResultsReturned:
          type: integer
          minimum: 0
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSearchSource"
        dataSourceNotice:
          type: string
      required: [personName, personRole, companyName, productOrCategory, city, state, generatedAt, searchCreditsUsed, searchResultsReturned, sources, dataSourceNotice]
    SapDataArea:
      type: string
      enum: [store, production, maintenance, inventory, sales, hr, power_electrical_solar, purchase, scrap, order, delivery]
    SapConnectionAreaMapping:
      type: object
      properties:
        area:
          $ref: "#/components/schemas/SapDataArea"
        resourcePath:
          type: string
          minLength: 1
          maxLength: 300
        filterTemplate:
          type: string
          maxLength: 1000
          description: OData filter expression using {start}, {end}, and {organization} placeholders.
        dateField:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        idField:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        titleField:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        summaryFields:
          type: array
          maxItems: 12
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        topic:
          type: string
          enum: [news, hire, launch, financial, risk]
      required: [area, resourcePath, filterTemplate, dateField, idField, titleField, summaryFields, topic]
    SapConnectionInput:
      type: object
      properties:
        serviceRoot:
          type: string
          format: uri
          maxLength: 2048
        tokenUrl:
          type: string
          format: uri
          maxLength: 2048
        fioriUrl:
          type: string
          format: uri
          maxLength: 2048
        clientId:
          type: string
          maxLength: 512
        clientSecret:
          type: string
          maxLength: 4096
        scope:
          type: string
          maxLength: 1024
        organizations:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 120
        areas:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SapConnectionAreaMapping"
      required: [serviceRoot, tokenUrl, fioriUrl, organizations, areas]
    SapConnectionSettings:
      type: object
      properties:
        configured:
          type: boolean
        storageReady:
          type: boolean
        clientCredentialsConfigured:
          type: boolean
        hasSavedConnection:
          type: boolean
        legacyEnvironmentConfig:
          type: boolean
          description: Whether a legacy server-managed SAP config is also present.
        legacyEnvironmentConfigActive:
          type: boolean
        legacyEnvironmentConfigSuppressed:
          type: boolean
        serviceRoot:
          type: ["string", "null"]
          format: uri
        tokenUrl:
          type: ["string", "null"]
          format: uri
        fioriUrl:
          type: ["string", "null"]
          format: uri
        scope:
          type: ["string", "null"]
        organizations:
          type: array
          items:
            type: string
        areas:
          type: array
          items:
            $ref: "#/components/schemas/SapConnectionAreaMapping"
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required: [configured, storageReady, clientCredentialsConfigured, hasSavedConnection, legacyEnvironmentConfig, legacyEnvironmentConfigActive, legacyEnvironmentConfigSuppressed, serviceRoot, tokenUrl, fioriUrl, scope, organizations, areas, updatedAt]
    SapConnectionTestResult:
      type: object
      properties:
        connected:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        message:
          type: string
      required: [connected, checkedAt, message]
    SapConnectionDeleteResult:
      type: object
      properties:
        deleted:
          type: boolean
      required: [deleted]
    BriefSource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        publisher:
          type: string
        publishedAt:
          type: ["string", "null"]
        snippet:
          type: string
        affiliatedCompanyReport:
          type: boolean
          description: True when this source is about the selected person's associated company rather than the person.
        images:
          type: array
          description: Images extracted from this accepted source. Images remain optional when none are available.
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              description:
                type: string
            required: [url, description]
      required: [id, title, url, publisher, publishedAt, snippet, affiliatedCompanyReport]
    DailyBriefingEventLimitInput:
      type: object
      properties:
        dailyEventLimit:
          type: integer
          minimum: 1
          maximum: 10
          description: Maximum number of complete briefing events for the signed-in user per Asia/Kolkata calendar day.
      required: [dailyEventLimit]
    DailyBriefingEventLimitResponse:
      type: object
      properties:
        dailyEventLimit:
          type: integer
          minimum: 1
          maximum: 10
      required: [dailyEventLimit]
    BriefingSourceStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [tavily]
        configured:
          type: boolean
          description: Whether this signed-in account has an effective Tavily key.
        canStart:
          type: boolean
          description: Whether an authenticated account may start a crawl; an effective Tavily key and that account's PIN are still required.
        keySource:
          type: string
          enum: [project-owner, account, missing]
          description: Effective key source for this account; the project key is owner-only.
        startPinConfigured:
          type: boolean
        ownerAccountConfigured:
          type: boolean
        dailyCrawlLimitMs:
          type: integer
          minimum: 0
        dailyCrawlUsedMs:
          type: ["integer", "null"]
          minimum: 0
        dailyCrawlRemainingMs:
          type: ["integer", "null"]
          minimum: 0
        dailyCrawlActive:
          type: boolean
        dailyCrawlResetsAt:
          type: ["string", "null"]
          format: date-time
        dailyCrawlStartsLimit:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
          description: The signed-in user's configured daily event limit; defaults to ten and resets at midnight IST.
        dailyCrawlStartsUsed:
          type: ["integer", "null"]
          minimum: 0
        dailyCrawlStartsRemaining:
          type: ["integer", "null"]
          minimum: 0
        dailySearchRequestsLimit:
          type: ["integer", "null"]
          minimum: 0
          maximum: 50
          description: The configured daily event limit multiplied by five selected-topic searches per event.
        dailySearchRequestsUsed:
          type: ["integer", "null"]
          minimum: 0
        dailySearchRequestsRemaining:
          type: ["integer", "null"]
          minimum: 0
        maxSearchesPerBriefing:
          type: integer
          minimum: 1
          maximum: 5
          description: One request per selected topic, up to five topics.
        searchDepth:
          type: string
          enum: [basic]
        sapConfigured:
          type: boolean
          description: Whether the server has an SAP S/4HANA OAuth connection and at least one approved area mapping configured. This does not probe SAP.
        sapAvailableAreas:
          type: array
          items:
            $ref: "#/components/schemas/SapDataArea"
      required:
        - provider
        - configured
        - canStart
        - keySource
        - startPinConfigured
        - ownerAccountConfigured
        - dailyCrawlLimitMs
        - dailyCrawlUsedMs
        - dailyCrawlRemainingMs
        - dailyCrawlActive
        - dailyCrawlResetsAt
        - dailyCrawlStartsLimit
        - dailyCrawlStartsUsed
        - dailyCrawlStartsRemaining
        - dailySearchRequestsLimit
        - dailySearchRequestsUsed
        - dailySearchRequestsRemaining
        - maxSearchesPerBriefing
        - searchDepth
        - sapConfigured
        - sapAvailableAreas
    TavilyCredentialStatus:
